<!DOCTYPE html>
<html>
<head>
  <title>PromptForge Income Builder</title>
  <style>
    body { width: 350px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 15px; background: #f9fafb; }
    h1 { font-size: 18px; color: #111827; margin-bottom: 10px; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { margin-top: 10px; width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    #results { margin-top: 15px; }
    .card { background: white; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s; }
    .card:hover { transform: translateY(-2px); border-color: #2563eb; }
    .card-title { font-weight: 600; font-size: 14px; color: #1f2937; }
    .card-meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #ecfdf5; color: #059669; font-size: 10px; font-weight: 700; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>PromptForge Income Builder</h1>
  <textarea id="input" placeholder="Describe your income asset idea (e.g., fitness app for passive income)..."></textarea>
  <button id="generate">Generate Options</button>
  <div id="results"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
