<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETHINX — Command Dashboard</title>
  <style>
    /* ── TDOG ANIMATIONS ─────────────────── */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes glow-pulse { 0%,100%{filter:drop-shadow(0 0 6px rgba(0,234,255,0.4))} 50%{filter:drop-shadow(0 0 18px rgba(0,234,255,0.8))} }
    @keyframes gold-glow { 0%,100%{filter:drop-shadow(0 0 6px rgba(255,170,0,0.3))} 50%{filter:drop-shadow(0 0 16px rgba(255,170,0,0.7))} }
    @keyframes slide-in-right { 0%{transform:translateX(40px);opacity:0} 100%{transform:translateX(0);opacity:1} }
    @keyframes slide-in-up { 0%{transform:translateY(20px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    @keyframes spin-slow { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.3} 94%{opacity:1} 96%{opacity:0.5} 97%{opacity:1} }
    @keyframes power-up { 0%{transform:scale(0.8);opacity:0;filter:brightness(2)} 60%{transform:scale(1.05);opacity:1;filter:brightness(1.3)} 100%{transform:scale(1);opacity:1;filter:brightness(1)} }
    @keyframes action-fly { 0%{transform:translate(-20px,10px) rotate(-5deg);opacity:0.7} 50%{transform:translate(5px,-5px) rotate(2deg);opacity:1} 100%{transform:translate(0,0) rotate(0deg);opacity:1} }
    .anim-float { animation: float 3s ease-in-out infinite; }
    .anim-glow { animation: glow-pulse 2s ease-in-out infinite; }
    .anim-gold { animation: gold-glow 2.5s ease-in-out infinite; }
    .anim-slide-r { animation: slide-in-right 0.6s ease-out; }
    .anim-slide-u { animation: slide-in-up 0.5s ease-out; }
    .anim-flicker { animation: flicker 4s infinite; }
    .anim-power { animation: power-up 0.8s ease-out; }
    .anim-fly { animation: action-fly 1s ease-out; }

    .tdog-mascot { border-radius: 4px; object-fit: contain; image-rendering: auto; }
    .tdog-sidebar-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,170,0,0.5); margin: 0 auto 8px; display: block; animation: gold-glow 2.5s ease-in-out infinite; }
    .tdog-topbar-mascot { width: 28px; height: 28px; border-radius: 4px; animation: float 3s ease-in-out infinite; cursor: pointer; transition: transform 0.2s; }
    .tdog-topbar-mascot:hover { transform: scale(1.3); }
    .tdog-hero { width: 120px; height: 120px; border-radius: 8px; animation: power-up 0.8s ease-out, gold-glow 2.5s ease-in-out infinite 0.8s; }
    .tdog-action { width: 80px; height: 80px; animation: action-fly 1s ease-out, float 3s ease-in-out infinite 1s; }
    .tdog-pixel { width: 48px; height: 48px; image-rendering: pixelated; animation: flicker 4s infinite; }
    .tdog-badge { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,170,0,0.4); vertical-align: middle; margin-right: 6px; }

    .hero-banner { display: flex; align-items: center; gap: 20px; padding: 20px; background: linear-gradient(135deg, var(--surface2), var(--surface)); border: 1px solid var(--border); border-radius: 4px; grid-column: span 12; animation: slide-in-up 0.5s ease-out; }
    .hero-text h2 { font-size: 18px; font-weight: 700; color: var(--amber); margin-bottom: 4px; }
    .hero-text p { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    .hero-accent { color: var(--cyan); font-weight: 600; }

    .mascot-corner { position: fixed; bottom: 16px; right: 16px; z-index: 100; cursor: pointer; transition: transform 0.3s; }
    .mascot-corner:hover { transform: scale(1.15) rotate(5deg); }
    .mascot-corner img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,170,0,0.5); animation: gold-glow 2.5s ease-in-out infinite, float 3s ease-in-out infinite; }

    .page-enter { animation: slide-in-up 0.3s ease-out; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0f14; --surface: #0f1319; --surface2: #151b24; --surface3: #1a2230;
      --border: #1c2a3a; --border-light: #243447;
      --text: #e2e8f0; --text-dim: #5a6a7e; --text-muted: #3a4a5e;
      --cyan: #00eaff; --cyan-dim: rgba(0,234,255,0.15); --cyan-glow: rgba(0,234,255,0.3);
      --green: #00ff88; --green-dim: rgba(0,255,136,0.15);
      --red: #ff4466; --red-dim: rgba(255,68,102,0.15);
      --purple: #8b5cf6; --purple-dim: rgba(139,92,246,0.15);
      --amber: #ffaa00; --amber-dim: rgba(255,170,0,0.15);
      --gray: #64748b;
    }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.4; overflow: hidden; height: 100vh; width: 100vw; max-width: 100vw; }
    .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: 48px 1fr; height: 100vh; width: 100%; overflow: hidden; }

    /* TOPBAR */
    .topbar { grid-column: 1/-1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; }
    .topbar-logo { font-size: 16px; font-weight: 700; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 20px var(--cyan-glow); }
    .topbar-center { display: flex; align-items: center; gap: 8px; }
    .ws-dot { width: 8px; height: 8px; border-radius: 50%; }
    .ws-dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .ws-dot.dead { background: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .ws-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-time { font-size: 13px; font-weight: 500; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .topbar-user { width: 28px; height: 28px; border-radius: 4px; background: var(--surface3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .topbar-user svg { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }

    /* SIDEBAR */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; color: var(--text-dim); font-size: 12px; }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--cyan); border-left-color: var(--cyan); background: var(--cyan-dim); font-weight: 500; }
    .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* MAIN */
    .main { padding: 16px; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-content: start; min-width: 0; }
    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: var(--bg); }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* PANELS */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .panel-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
    .panel-body { padding: 14px; flex: 1; }
    .panel-body.np { padding: 0; }

    /* GRID SPANS */
    .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s6 { grid-column: span 6; }
    .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }

    /* METRICS */
    .rev-big { font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .rev-delta { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .rev-delta.up { color: var(--green); } .rev-delta.down { color: var(--red); }
    .rev-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .q-big { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
    .q-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* STATUS PILLS */
    .pill-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .status-pill { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-pill.running { background: var(--green-dim); color: var(--green); }
    .status-pill.idle { background: var(--surface3); color: var(--gray); }
    .status-pill.error { background: var(--red-dim); color: var(--red); }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill-count { font-weight: 700; }

    /* GAUGES */
    .gauges-row { display: flex; justify-content: space-around; align-items: center; gap: 12px; }
    .gauge-wrap { text-align: center; flex: 1; }
    .gauge-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
    .gauge-value { font-size: 20px; font-weight: 700; }

    /* AGENT ROWS */
    .agent-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface2); border-radius: 3px; margin-bottom: 6px; border: 1px solid var(--border); }
    .agent-left { display: flex; align-items: center; gap: 10px; }
    .agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .agent-dot.running { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .agent-dot.idle { background: var(--gray); }
    .agent-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .agent-name { font-weight: 500; font-size: 12px; }
    .agent-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 2px; }
    .agent-badge.running { background: var(--green-dim); color: var(--green); }
    .agent-badge.idle { background: var(--surface3); color: var(--gray); }
    .agent-badge.error { background: var(--red-dim); color: var(--red); }
    .agent-btns { display: flex; gap: 4px; }
    .agent-btn { width: 28px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface3); border-radius: 2px; cursor: pointer; transition: all 0.15s; color: var(--text-dim); }
    .agent-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .agent-btn.danger:hover { border-color: var(--red); color: var(--red); }
    .agent-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
    .run-all-btn { width: 100%; padding: 8px; margin-top: 8px; background: linear-gradient(135deg, rgba(0,234,255,0.15), rgba(0,234,255,0.05)); border: 1px solid var(--cyan); border-radius: 3px; color: var(--cyan); font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; text-shadow: 0 0 10px var(--cyan-glow); }
    .run-all-btn:hover { background: rgba(0,234,255,0.2); box-shadow: 0 0 20px var(--cyan-glow); }

    /* PLUGIN ROWS */
    .plugin-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface2); border-radius: 3px; margin-bottom: 6px; border: 1px solid var(--border); }
    .plugin-left { display: flex; align-items: center; gap: 10px; }
    .plugin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .plugin-right { display: flex; align-items: center; gap: 8px; }
    .toggle { width: 36px; height: 18px; border-radius: 9px; background: var(--surface3); border: 1px solid var(--border); position: relative; cursor: pointer; transition: all 0.2s; }
    .toggle.on { background: var(--cyan-dim); border-color: var(--cyan); }
    .toggle-knob { width: 14px; height: 14px; border-radius: 7px; background: var(--gray); position: absolute; top: 1px; left: 1px; transition: all 0.2s; }
    .toggle.on .toggle-knob { left: 19px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .plugin-action { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--border); background: var(--surface3); color: var(--text-dim); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .plugin-action:hover { border-color: var(--purple); color: var(--purple); }
    .plugin-action.remove:hover { border-color: var(--red); color: var(--red); }

    /* LOGS */
    .log-scroll { max-height: 300px; overflow-y: auto; font-size: 11px; }
    .log-scroll::-webkit-scrollbar { width: 4px; } .log-scroll::-webkit-scrollbar-track { background: var(--surface); } .log-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }
    .log-line { padding: 3px 0; border-bottom: 1px solid rgba(28,42,58,0.5); display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
    .log-time { color: var(--text-muted); flex-shrink: 0; width: 70px; }
    .log-src { color: var(--purple); font-weight: 600; flex-shrink: 0; min-width: 100px; }
    .log-msg { color: var(--text-dim); }
    .log-line.error .log-msg { color: var(--red); } .log-line.warn .log-msg { color: var(--amber); } .log-line.info .log-msg { color: var(--text); }

    /* TABLES */
    .tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tbl th { text-align: left; padding: 8px 10px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--surface2); }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
    .tbl tr:hover td { background: var(--surface2); }

    /* QUEUE BARS */
    .q-bar-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .q-bar-stat { flex: 1; text-align: center; padding: 12px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; }
    .q-bar-num { font-size: 24px; font-weight: 700; }
    .q-bar-lbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* SETTINGS */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; margin-bottom: 6px; }
    .setting-label { font-weight: 500; }
    .setting-val { color: var(--cyan); font-size: 11px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .setting-input { background: var(--surface3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 3px; font-family: inherit; font-size: 11px; width: 300px; }
    .setting-input:focus { outline: none; border-color: var(--cyan); }

    /* FILTER BAR */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .filter-btn { padding: 4px 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .search-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 3px; font-family: inherit; font-size: 11px; }
    .search-input:focus { outline: none; border-color: var(--cyan); }
    .search-input::placeholder { color: var(--text-muted); }

    /* MEMORY INSPECTOR */
    .mem-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .mem-key { background: var(--purple-dim); color: var(--purple); padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 600; min-width: 180px; }
    .mem-val { color: var(--text); font-size: 11px; }

    /* PLAYBOOK */
    .pb-progress { display: flex; gap: 0; margin-bottom: 20px; }
    .pb-step-dot { flex: 1; height: 4px; background: var(--surface3); position: relative; transition: all 0.3s; }
    .pb-step-dot.done { background: var(--green); }
    .pb-step-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
    .pb-step-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .pb-step-btn { padding: 6px 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 10px; cursor: pointer; transition: all 0.15s; }
    .pb-step-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .pb-step-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pb-step-btn.done { border-color: var(--green); color: var(--green); }
    .pb-content { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 20px; }
    .pb-title { font-size: 16px; font-weight: 700; color: var(--cyan); margin-bottom: 4px; }
    .pb-subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; }
    .pb-section { margin-bottom: 16px; }
    .pb-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--purple); margin-bottom: 8px; }
    .pb-text { color: var(--text); font-size: 12px; line-height: 1.7; margin-bottom: 8px; }
    .pb-code { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; font-size: 11px; color: var(--green); overflow-x: auto; margin: 8px 0; white-space: pre-wrap; word-break: break-word; line-height: 1.6; max-width: 100%; }
    .pb-code-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
    .pb-file { color: var(--cyan); font-weight: 500; }
    .pb-warn { background: var(--amber-dim); border: 1px solid rgba(255,170,0,0.3); border-radius: 3px; padding: 8px 12px; color: var(--amber); font-size: 11px; margin: 8px 0; }
    .pb-tip { background: var(--cyan-dim); border: 1px solid rgba(0,234,255,0.2); border-radius: 3px; padding: 8px 12px; color: var(--cyan); font-size: 11px; margin: 8px 0; }
    .pb-nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
    .pb-nav-btn { padding: 8px 20px; border: 1px solid var(--border); background: var(--surface3); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; }
    .pb-nav-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .pb-nav-btn.primary { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pb-checklist { list-style: none; padding: 0; }
    .pb-check-item { padding: 6px 0; display: flex; align-items: flex-start; gap: 8px; color: var(--text); font-size: 12px; cursor: pointer; }
    .pb-check-box { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 2px; background: var(--surface3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.15s; }
    .pb-check-box.checked { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .pb-arch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
    .pb-arch-card { background: var(--surface3); border: 1px solid var(--border); border-radius: 3px; padding: 10px; text-align: center; }
    .pb-arch-card-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .pb-arch-card-desc { font-size: 10px; color: var(--text-dim); }

    /* ── SLIDE-OVER (Playbook full-screen drawer) ───────────────────────── */
    .slide-over {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      background: var(--bg); z-index: 200;
      transform: translateX(100%);
      transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .slide-over.open { transform: translateX(0); }
    .slide-over-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 48px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .slide-over-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
    .slide-over-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--surface2); border-radius: 3px;
      cursor: pointer; color: var(--text-dim); transition: all 0.15s;
    }
    .slide-over-close:hover { border-color: var(--red); color: var(--red); }
    .slide-over-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .slide-over-body {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px;
      display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-content: start;
    }
    .slide-over-body::-webkit-scrollbar { width: 4px; }
    .slide-over-body::-webkit-scrollbar-track { background: var(--bg); }
    .slide-over-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── CHAT PANEL (right-side drawer) ─────────────────────────────────── */
    .chat-panel {
      position: fixed; top: 48px; right: 0; bottom: 0; width: 380px;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 150; transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    .chat-panel.open { transform: translateX(0); }
    .chat-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 44px; background: var(--surface2);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--amber); display: flex; align-items: center; gap: 8px; }
    .chat-panel-close { cursor: pointer; color: var(--text-dim); display: flex; align-items: center; }
    .chat-panel-close:hover { color: var(--red); }
    .chat-panel-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .chat-msgs {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msgs::-webkit-scrollbar { width: 4px; }
    .chat-msgs::-webkit-scrollbar-track { background: var(--surface); }
    .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .chat-msg { display: flex; flex-direction: column; gap: 3px; max-width: 90%; }
    .chat-msg.user { align-self: flex-end; align-items: flex-end; }
    .chat-msg.bot  { align-self: flex-start; align-items: flex-start; }
    .chat-bubble {
      padding: 8px 12px; border-radius: 4px; font-size: 12px; line-height: 1.6; word-break: break-word;
    }
    .chat-msg.user .chat-bubble { background: var(--cyan-dim); border: 1px solid rgba(0,234,255,0.25); color: var(--text); }
    .chat-msg.bot  .chat-bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .chat-meta { font-size: 9px; color: var(--text-muted); letter-spacing: 0.5px; }
    .chat-input-row {
      display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 3px; font-family: inherit; font-size: 11px; resize: none;
      height: 38px; outline: none; transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--cyan); }
    .chat-send {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      background: var(--cyan-dim); border: 1px solid var(--cyan); border-radius: 3px;
      cursor: pointer; transition: all 0.15s; color: var(--cyan); flex-shrink: 0;
    }
    .chat-send:hover { background: rgba(0,234,255,0.25); box-shadow: 0 0 10px var(--cyan-glow); }
    .chat-send svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .chat-toggle {
      display: flex; align-items: center; gap: 6px; padding: 4px 12px;
      border: 1px solid var(--border); background: var(--surface2); border-radius: 3px;
      cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); transition: all 0.15s;
    }
    .chat-toggle:hover, .chat-toggle.active { border-color: var(--amber); color: var(--amber); background: rgba(255,170,0,0.08); }
    .chat-toggle svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── CONTENT ENGINE ────────────────────────────────── */
    .c-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; display: block; }
    .c-input, .c-select, .c-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 3px; font-family: inherit; font-size: 12px; outline: none; transition: border-color 0.15s; }
    .c-input:focus, .c-select:focus, .c-textarea:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,234,255,0.15); }
    .c-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
    .c-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .c-form-col { display: flex; flex-direction: column; gap: 12px; }
    .c-btn { padding: 8px 16px; border-radius: 3px; font-family: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1px solid var(--border); background: var(--surface3); color: var(--text-dim); transition: all 0.15s; }
    .c-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .c-btn.primary { border-color: var(--cyan); background: var(--cyan-dim); color: var(--cyan); }
    .c-btn.primary:hover { background: rgba(0,234,255,0.25); box-shadow: 0 0 14px var(--cyan-glow); }
    .c-btn.danger { border-color: var(--red); background: var(--red-dim); color: var(--red); }
    .c-btn.danger:hover { box-shadow: 0 0 10px rgba(255,68,102,0.3); }
    .c-btn.success { border-color: var(--green); background: var(--green-dim); color: var(--green); }
    .c-btn.ghost { background: transparent; }
    .c-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .c-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .c-status { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .c-status.draft { background: var(--surface3); color: var(--gray); }
    .c-status.generating { background: var(--amber-dim); color: var(--amber); }
    .c-status.draft_ready { background: var(--cyan-dim); color: var(--cyan); }
    .c-status.in_review { background: var(--purple-dim); color: var(--purple); }
    .c-status.approved { background: var(--green-dim); color: var(--green); }
    .c-status.scheduled { background: var(--cyan-dim); color: var(--cyan); }
    .c-status.published { background: var(--green-dim); color: var(--green); }
    .c-status.error { background: var(--red-dim); color: var(--red); }
    .c-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 14px; margin-bottom: 8px; transition: all 0.15s; }
    .c-card:hover { border-color: var(--border-light); }
    .c-card.selected { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,234,255,0.12); }
    .c-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .c-card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .c-card-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
    .c-chip { display: inline-block; background: var(--surface3); border: 1px solid var(--border); color: var(--text-dim); padding: 1px 8px; border-radius: 10px; font-size: 10px; margin-right: 4px; }
    .c-meta { font-size: 10px; color: var(--text-muted); }
    .c-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 12px; }
    .c-empty-cta { margin-top: 12px; }
    .c-pill-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
    .c-pill-toggle button { padding: 4px 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); border-radius: 12px; font-family: inherit; font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .c-pill-toggle button.on { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .c-progress { height: 4px; border-radius: 2px; background: var(--surface3); overflow: hidden; margin-top: 8px; }
    .c-progress > div { height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); transition: width 0.4s; }
    .c-spin { width: 14px; height: 14px; border: 2px solid var(--border-light); border-top-color: var(--cyan); border-radius: 50%; display: inline-block; animation: spin-slow 0.8s linear infinite; vertical-align: middle; }
    .c-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border-light); padding: 10px 18px; border-radius: 4px; font-size: 12px; z-index: 300; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .c-toast.ok { border-color: var(--green); color: var(--green); }
    .c-toast.err { border-color: var(--red); color: var(--red); }
    .c-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
    .c-version-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--surface3); border-radius: 3px; margin-bottom: 6px; font-size: 11px; cursor: pointer; border: 1px solid transparent; }
    .c-version-row:hover, .c-version-row.active { border-color: var(--cyan); }
    .c-gauge-num { font-size: 28px; font-weight: 700; color: var(--green); }
    .c-rate { font-size: 13px; font-weight: 600; }
    .c-mini-chart { margin-top: 8px; }

    @media (max-width: 1280px) {
      .app { grid-template-columns: 56px minmax(0, 1fr); }
      .nav-item span { display: none; } .nav-item { justify-content: center; padding: 10px; }
      .s4, .s5, .s3 { grid-column: span 6; } .s6 { grid-column: span 12; } .s8 { grid-column: span 12; }
    }
    @media (max-width: 900px) {
      .s4, .s5, .s3, .s6, .s8 { grid-column: span 12; }
    }
  </style>
</head>
