<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETHINX — Command Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    /* ── TDOG ANIMATIONS ─────────────────── */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes glow-pulse { 0%,100%{filter:drop-shadow(0 0 6px rgba(0,234,255,0.4))} 50%{filter:drop-shadow(0 0 18px rgba(0,234,255,0.8))} }
    @keyframes gold-glow { 0%,100%{filter:drop-shadow(0 0 6px rgba(255,170,0,0.3))} 50%{filter:drop-shadow(0 0 16px rgba(255,170,0,0.7))} }
    @keyframes slide-in-right { 0%{transform:translateX(40px);opacity:0} 100%{transform:translateX(0);opacity:1} }
    @keyframes slide-in-up { 0%{transform:translateY(20px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    @keyframes spin-slow { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.3} 94%{opacity:1} 96%{opacity:0.5} 97%{opacity:1} }
    @keyframes power-up { 0%{transform:scale(0.8);opacity:0;filter:brightness(2)} 60%{transform:scale(1.05);opacity:1;filter:brightness(1.3)} 100%{transform:scale(1);opacity:1;filter:brightness(1)} }
    @keyframes action-fly { 0%{transform:translate(-20px,10px) rotate(-5deg);opacity:0.7} 50%{transform:translate(5px,-5px) rotate(2deg);opacity:1} 100%{transform:translate(0,0) rotate(0deg);opacity:1} }
    .anim-float { animation: float 3s ease-in-out infinite; }
    .anim-glow { animation: glow-pulse 2s ease-in-out infinite; }
    .anim-gold { animation: gold-glow 2.5s ease-in-out infinite; }
    .anim-slide-r { animation: slide-in-right 0.6s ease-out; }
    .anim-slide-u { animation: slide-in-up 0.5s ease-out; }
    .anim-flicker { animation: flicker 4s infinite; }
    .anim-power { animation: power-up 0.8s ease-out; }
    .anim-fly { animation: action-fly 1s ease-out; }

    .tdog-mascot { border-radius: 4px; object-fit: contain; image-rendering: auto; }
    .tdog-sidebar-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,170,0,0.5); margin: 0 auto 8px; display: block; animation: gold-glow 2.5s ease-in-out infinite; }
    .tdog-topbar-mascot { width: 28px; height: 28px; border-radius: 4px; animation: float 3s ease-in-out infinite; cursor: pointer; transition: transform 0.2s; }
    .tdog-topbar-mascot:hover { transform: scale(1.3); }
    .tdog-hero { width: 120px; height: 120px; border-radius: 8px; animation: power-up 0.8s ease-out, gold-glow 2.5s ease-in-out infinite 0.8s; }
    .tdog-action { width: 80px; height: 80px; animation: action-fly 1s ease-out, float 3s ease-in-out infinite 1s; }
    .tdog-pixel { width: 48px; height: 48px; image-rendering: pixelated; animation: flicker 4s infinite; }
    .tdog-badge { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,170,0,0.4); vertical-align: middle; margin-right: 6px; }

    .hero-banner { display: flex; align-items: center; gap: 20px; padding: 20px; background: linear-gradient(135deg, var(--surface2), var(--surface)); border: 1px solid var(--border); border-radius: 4px; grid-column: span 12; animation: slide-in-up 0.5s ease-out; }
    .hero-text h2 { font-size: 18px; font-weight: 700; color: var(--amber); margin-bottom: 4px; }
    .hero-text p { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    .hero-accent { color: var(--cyan); font-weight: 600; }

    .mascot-corner { position: fixed; bottom: 16px; right: 16px; z-index: 100; cursor: pointer; transition: transform 0.3s; }
    .mascot-corner:hover { transform: scale(1.15) rotate(5deg); }
    .mascot-corner img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,170,0,0.5); animation: gold-glow 2.5s ease-in-out infinite, float 3s ease-in-out infinite; }

    .page-enter { animation: slide-in-up 0.3s ease-out; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0f14; --surface: #0f1319; --surface2: #151b24; --surface3: #1a2230;
      --border: #1c2a3a; --border-light: #243447;
      --text: #e2e8f0; --text-dim: #5a6a7e; --text-muted: #3a4a5e;
      --cyan: #00eaff; --cyan-dim: rgba(0,234,255,0.15); --cyan-glow: rgba(0,234,255,0.3);
      --green: #00ff88; --green-dim: rgba(0,255,136,0.15);
      --red: #ff4466; --red-dim: rgba(255,68,102,0.15);
      --purple: #8b5cf6; --purple-dim: rgba(139,92,246,0.15);
      --amber: #ffaa00; --amber-dim: rgba(255,170,0,0.15);
      --gray: #64748b;
    }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.4; overflow: hidden; height: 100vh; width: 100vw; max-width: 100vw; }
    .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: 48px 1fr; height: 100vh; width: 100%; overflow: hidden; }

    /* TOPBAR */
    .topbar { grid-column: 1/-1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; }
    .topbar-logo { font-size: 16px; font-weight: 700; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 20px var(--cyan-glow); }
    .topbar-center { display: flex; align-items: center; gap: 8px; }
    .ws-dot { width: 8px; height: 8px; border-radius: 50%; }
    .ws-dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .ws-dot.dead { background: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .ws-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-time { font-size: 13px; font-weight: 500; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .topbar-user { width: 28px; height: 28px; border-radius: 4px; background: var(--surface3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .topbar-user svg { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }

    /* SIDEBAR */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; color: var(--text-dim); font-size: 12px; }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--cyan); border-left-color: var(--cyan); background: var(--cyan-dim); font-weight: 500; }
    .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* MAIN */
    .main { padding: 16px; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-content: start; min-width: 0; }
    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: var(--bg); }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* PANELS */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .panel-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
    .panel-body { padding: 14px; flex: 1; }
    .panel-body.np { padding: 0; }

    /* GRID SPANS */
    .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s6 { grid-column: span 6; }
    .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }

    /* METRICS */
    .rev-big { font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .rev-delta { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .rev-delta.up { color: var(--green); } .rev-delta.down { color: var(--red); }
    .rev-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .q-big { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
    .q-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* STATUS PILLS */
    .pill-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .status-pill { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-pill.running { background: var(--green-dim); color: var(--green); }
    .status-pill.idle { background: var(--surface3); color: var(--gray); }
    .status-pill.error { background: var(--red-dim); color: var(--red); }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill-count { font-weight: 700; }

    /* GAUGES */
    .gauges-row { display: flex; justify-content: space-around; align-items: center; gap: 12px; }
    .gauge-wrap { text-align: center; flex: 1; }
    .gauge-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
    .gauge-value { font-size: 20px; font-weight: 700; }

    /* AGENT ROWS */
    .agent-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface2); border-radius: 3px; margin-bottom: 6px; border: 1px solid var(--border); }
    .agent-left { display: flex; align-items: center; gap: 10px; }
    .agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .agent-dot.running { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .agent-dot.idle { background: var(--gray); }
    .agent-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .agent-name { font-weight: 500; font-size: 12px; }
    .agent-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 2px; }
    .agent-badge.running { background: var(--green-dim); color: var(--green); }
    .agent-badge.idle { background: var(--surface3); color: var(--gray); }
    .agent-badge.error { background: var(--red-dim); color: var(--red); }
    .agent-btns { display: flex; gap: 4px; }
    .agent-btn { width: 28px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface3); border-radius: 2px; cursor: pointer; transition: all 0.15s; color: var(--text-dim); }
    .agent-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .agent-btn.danger:hover { border-color: var(--red); color: var(--red); }
    .agent-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
    .run-all-btn { width: 100%; padding: 8px; margin-top: 8px; background: linear-gradient(135deg, rgba(0,234,255,0.15), rgba(0,234,255,0.05)); border: 1px solid var(--cyan); border-radius: 3px; color: var(--cyan); font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; text-shadow: 0 0 10px var(--cyan-glow); }
    .run-all-btn:hover { background: rgba(0,234,255,0.2); box-shadow: 0 0 20px var(--cyan-glow); }

    /* PLUGIN ROWS */
    .plugin-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface2); border-radius: 3px; margin-bottom: 6px; border: 1px solid var(--border); }
    .plugin-left { display: flex; align-items: center; gap: 10px; }
    .plugin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .plugin-right { display: flex; align-items: center; gap: 8px; }
    .toggle { width: 36px; height: 18px; border-radius: 9px; background: var(--surface3); border: 1px solid var(--border); position: relative; cursor: pointer; transition: all 0.2s; }
    .toggle.on { background: var(--cyan-dim); border-color: var(--cyan); }
    .toggle-knob { width: 14px; height: 14px; border-radius: 7px; background: var(--gray); position: absolute; top: 1px; left: 1px; transition: all 0.2s; }
    .toggle.on .toggle-knob { left: 19px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .plugin-action { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--border); background: var(--surface3); color: var(--text-dim); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .plugin-action:hover { border-color: var(--purple); color: var(--purple); }
    .plugin-action.remove:hover { border-color: var(--red); color: var(--red); }

    /* LOGS */
    .log-scroll { max-height: 300px; overflow-y: auto; font-size: 11px; }
    .log-scroll::-webkit-scrollbar { width: 4px; } .log-scroll::-webkit-scrollbar-track { background: var(--surface); } .log-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }
    .log-line { padding: 3px 0; border-bottom: 1px solid rgba(28,42,58,0.5); display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
    .log-time { color: var(--text-muted); flex-shrink: 0; width: 70px; }
    .log-src { color: var(--purple); font-weight: 600; flex-shrink: 0; min-width: 100px; }
    .log-msg { color: var(--text-dim); }
    .log-line.error .log-msg { color: var(--red); } .log-line.warn .log-msg { color: var(--amber); } .log-line.info .log-msg { color: var(--text); }

    /* TABLES */
    .tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tbl th { text-align: left; padding: 8px 10px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--surface2); }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
    .tbl tr:hover td { background: var(--surface2); }

    /* QUEUE BARS */
    .q-bar-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .q-bar-stat { flex: 1; text-align: center; padding: 12px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; }
    .q-bar-num { font-size: 24px; font-weight: 700; }
    .q-bar-lbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* SETTINGS */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; margin-bottom: 6px; }
    .setting-label { font-weight: 500; }
    .setting-val { color: var(--cyan); font-size: 11px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .setting-input { background: var(--surface3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 3px; font-family: inherit; font-size: 11px; width: 300px; }
    .setting-input:focus { outline: none; border-color: var(--cyan); }

    /* FILTER BAR */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .filter-btn { padding: 4px 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .search-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 3px; font-family: inherit; font-size: 11px; }
    .search-input:focus { outline: none; border-color: var(--cyan); }
    .search-input::placeholder { color: var(--text-muted); }

    /* MEMORY INSPECTOR */
    .mem-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .mem-key { background: var(--purple-dim); color: var(--purple); padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 600; min-width: 180px; }
    .mem-val { color: var(--text); font-size: 11px; }

    /* PLAYBOOK */
    .pb-progress { display: flex; gap: 0; margin-bottom: 20px; }
    .pb-step-dot { flex: 1; height: 4px; background: var(--surface3); position: relative; transition: all 0.3s; }
    .pb-step-dot.done { background: var(--green); }
    .pb-step-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
    .pb-step-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .pb-step-btn { padding: 6px 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 10px; cursor: pointer; transition: all 0.15s; }
    .pb-step-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .pb-step-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pb-step-btn.done { border-color: var(--green); color: var(--green); }
    .pb-content { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 20px; }
    .pb-title { font-size: 16px; font-weight: 700; color: var(--cyan); margin-bottom: 4px; }
    .pb-subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; }
    .pb-section { margin-bottom: 16px; }
    .pb-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--purple); margin-bottom: 8px; }
    .pb-text { color: var(--text); font-size: 12px; line-height: 1.7; margin-bottom: 8px; }
    .pb-code { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; font-size: 11px; color: var(--green); overflow-x: auto; margin: 8px 0; white-space: pre-wrap; word-break: break-word; line-height: 1.6; max-width: 100%; }
    .pb-code-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
    .pb-file { color: var(--cyan); font-weight: 500; }
    .pb-warn { background: var(--amber-dim); border: 1px solid rgba(255,170,0,0.3); border-radius: 3px; padding: 8px 12px; color: var(--amber); font-size: 11px; margin: 8px 0; }
    .pb-tip { background: var(--cyan-dim); border: 1px solid rgba(0,234,255,0.2); border-radius: 3px; padding: 8px 12px; color: var(--cyan); font-size: 11px; margin: 8px 0; }
    .pb-nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
    .pb-nav-btn { padding: 8px 20px; border: 1px solid var(--border); background: var(--surface3); color: var(--text-dim); border-radius: 3px; font-family: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; }
    .pb-nav-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .pb-nav-btn.primary { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pb-checklist { list-style: none; padding: 0; }
    .pb-check-item { padding: 6px 0; display: flex; align-items: flex-start; gap: 8px; color: var(--text); font-size: 12px; cursor: pointer; }
    .pb-check-box { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 2px; background: var(--surface3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.15s; }
    .pb-check-box.checked { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .pb-arch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
    .pb-arch-card { background: var(--surface3); border: 1px solid var(--border); border-radius: 3px; padding: 10px; text-align: center; }
    .pb-arch-card-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .pb-arch-card-desc { font-size: 10px; color: var(--text-dim); }

    /* ── SLIDE-OVER (Playbook full-screen drawer) ───────────────────────── */
    .slide-over {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      background: var(--bg); z-index: 200;
      transform: translateX(100%);
      transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .slide-over.open { transform: translateX(0); }
    .slide-over-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 48px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .slide-over-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
    .slide-over-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--surface2); border-radius: 3px;

    .slide-over-body {

    /* ── CHAT PANEL (right-side drawer) ─────────────────────────────────── */
    .chat-panel {
      position: fixed; top: 48px; right: 0; bottom: 0; width: 380px;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 150; transform: translateX(100%);

    }
    .chat-panel.open { transform: translateX(0); }
    .chat-panel-head {
      display: flex; align-items: center; justify-content: space-between;

      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--amber); display: flex; align-items: center; gap: 8px; }

    .chat-msgs::-webkit-scrollbar-track { background: var(--surface); }
    .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-msg.user { align-self: flex-end; align-items: flex-end; }
    .chat-msg.bot  { align-self: flex-start; align-items: flex-start; }
    .chat-bubble {
      padding: 8px 12px; border-radius: 4px; font-size: 12px; line-height: 1.6; word-break: break-word;

    .chat-msg.user .chat-bubble { background: var(--cyan-dim); border: 1px solid rgba(0,234,255,0.25); color: var(--text); }
    .chat-msg.bot  .chat-bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .chat-meta { font-size: 9px; color: var(--text-muted); letter-spacing: 0.5px; }
    .chat-input-row {
      display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 3px; font-family: inherit; font-size: 11px; resize: none;
      height: 38px; outline: none; transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--cyan); }
    .chat-send {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      background: var(--cyan-dim); border: 1px solid var(--cyan); border-radius: 3px;
      cursor: pointer; transition: all 0.15s; color: var(--cyan); flex-shrink: 0;
    }
    .chat-send:hover { background: rgba(0,234,255,0.25); box-shadow: 0 0 10px var(--cyan-glow); }

    .chat-toggle {

    .c-card:hover { border-color: var(--border-light); }

    .c-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }

    .c-pill-toggle button.on { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .c-progress { height: 4px; border-radius: 2px; background: var(--surface3); overflow: hidden; margin-top: 8px; }
    .c-progress > div { height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); transition: width 0.4s; }
    .c-spin { width: 14px; height: 14px; border: 2px solid var(--border-light); border-top-color: var(--cyan); border-radius: 50%; display: inline-block; animation: spin-slow 0.8s linear infinite; vertical-align: middle; }
    .c-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border-light); padding: 10px 18px; border-radius: 4px; font-size: 12px; z-index: 300; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .c-toast.ok { border-color: var(--green); color: var(--green); }

    @media (max-width: 1280px) {

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const api = (p) => fetch(`/api${p}`).then(r => r.json()).catch(() => null);
const apiPost = (p, b = {}) => fetch(`/api${p}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(r => r.json()).catch(() => null);

// Content API — scoped by tenant header (defaults to "default")
const TENANT = localStorage.getItem("ethinx:tenant") || "default";
const setTenant = (t) => { localStorage.setItem("ethinx:tenant", t); };

const cPost = (p, b = {}) => fetch(`/api/content${p}`, { method: "POST", headers: { "Content-Type": "application/json", "X-Tenant-Id": TENANT }, body: JSON.stringify(b) }).then(r => r.json()).catch(() => null);
const cPatch = (p, b = {}) => fetch(`/api/content${p}`, { method: "PATCH", headers: { "Content-Type": "application/json", "X-Tenant-Id": TENANT }, body: JSON.stringify(b) }).then(r => r.json()).catch(() => null);

// ─── SVG COMPONENTS ──────────────────────────────────
function Sparkline({ data, width = 200, height = 50, color = "var(--cyan)" }) {
  if (!data || data.length < 2) data = Array.from({ length: 20 }, (_, i) => 30 + Math.sin(i * 0.5) * 20 + Math.random() * 10);
  const max = Math.max(...data), min = Math.min(...data), range = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => `${i * step},${height - ((v - min) / range) * (height - 4) - 2}`);
  const pathD = `M${pts.join(" L")}`;
  const cid = `g${color.replace(/[^a-z0-9]/g, "")}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block", width: "100%" }}>
      <defs><linearGradient id={cid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.4"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <path d={`${pathD} L${width},${height} L0,${height} Z`} fill={`url(#${cid})`} opacity="0.3"/>
      <path d={pathD} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function BarChart({ data, width = 300, height = 80 }) {
  if (!data || !data.length) data = Array.from({ length: 12 }, () => ({ running: Math.floor(Math.random()*40)+10, idle: Math.floor(Math.random()*20), error: Math.floor(Math.random()*5) }));
  const maxV = Math.max(...data.map(d => d.running+d.idle+d.error)) || 1;
  const bw = (width/data.length)*0.7, gap = (width/data.length)*0.3;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block", width: "100%" }}>
      {data.map((d,i) => { const x=i*(bw+gap)+gap/2, rH=(d.running/maxV)*(height-4), iH=(d.idle/maxV)*(height-4), eH=(d.error/maxV)*(height-4); return (
        <g key={i}><rect x={x} y={height-rH} width={bw} height={rH} fill="var(--green)" opacity="0.8" rx="1"/><rect x={x} y={height-rH-iH} width={bw} height={iH} fill="var(--gray)" opacity="0.5" rx="1"/><rect x={x} y={height-rH-iH-eH} width={bw} height={eH} fill="var(--red)" opacity="0.7" rx="1"/></g>
      );})}
      <polyline points={data.map((d,i)=>`${i*(bw+gap)+gap/2+bw/2},${height-(d.running/maxV)*(height-4)-6}`).join(" ")} fill="none" stroke="var(--cyan)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/>
    </svg>
  );
}

function Gauge({ value=0, max=100, label="", color="var(--cyan)", unit="%" }) {
  const pct = Math.min(value/max,1), r=40, cx=50, cy=50;
  const sa=135, ea=405, ta=ea-sa, aa=sa+ta*pct;
  const p = (a) => { const rad=(a-90)*Math.PI/180; return { x: cx+r*Math.cos(rad), y: cy+r*Math.sin(rad) }; };
  const s=p(sa), e=p(ea), ae=p(aa);
  const bgPath = `M${s.x},${s.y} A${r},${r} 0 ${ta>180?1:0} 1 ${e.x},${e.y}`;
  const actPath = `M${s.x},${s.y} A${r},${r} 0 ${(aa-sa)>180?1:0} 1 ${ae.x},${ae.y}`;
  return (
    <div className="gauge-wrap">
      <svg width="100" height="75" viewBox="0 0 100 75">
        <path d={bgPath} fill="none" stroke="var(--surface3)" strokeWidth="6" strokeLinecap="round"/>
        <path d={actPath} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" style={{ filter: `drop-shadow(0 0 4px ${color})` }}/>
      </svg>
      <div className="gauge-value" style={{ color, marginTop: "-10px" }}>{unit==="Mbps"?value:Math.round(value)}<span style={{ fontSize:11,fontWeight:400,color:"var(--text-dim)" }}>{unit}</span></div>
      <div className="gauge-label">{label}</div>
    </div>
  );
}

function PlayIcon(){return <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>;}

const icons = {

  logs: <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
  settings: <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,

  approvals: <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>,
  calendar: <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="2.5"/><line x1="12" y1="15" x2="14" y2="17"/></svg>,
  performance: <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/><line x1="2" y1="20" x2="22" y2="20"/></svg>,
};

// ─── PAGE: DASHBOARD ─────────────────────────────────
function DashboardPage({ agents, revenue, queue, system, logs, logRef, onRunAll }) {
  const revData = useMemo(() => Array.from({ length: 24 }, (_, i) => 1200 + Math.sin(i*0.3)*400 + i*50 + Math.random()*200), []);
  const queueData = useMemo(() => Array.from({ length: 24 }, () => Math.floor(Math.random()*80)+20), []);
  const perfData = useMemo(() => Array.from({ length: 12 }, () => ({ running: Math.floor(Math.random()*40)+20, idle: Math.floor(Math.random()*15)+5, error: Math.floor(Math.random()*5) })), []);
  const rc = agents.filter(a=>a.state==="running").length, ic = agents.filter(a=>!a.state||a.state==="idle").length, ec = agents.filter(a=>a.state==="error").length;
  const cpuVal = system ? Math.min(95,(system.memoryMB/5)+15+Math.random()*10) : 32;
  const ramVal = system ? Math.min(95,system.memoryMB/5) : 58;
  return (
    <>
      {/* TDOG HERO BANNER */}
      <div className="hero-banner">
        <img src="/assets/3dtdog.gif" className="tdog-hero tdog-mascot" alt="T-Dog" onError={(e)=>{e.target.src="/assets/tdog-hero.png"}}/>

          <h2>ETHINX COMMAND CENTER</h2>
          <p>Sovereign automation cockpit — <span className="hero-accent">agents running</span>, <span className="hero-accent">plugins loaded</span>, <span style={{color:"var(--green)"}}>systems green</span>.<br/>Automate the automation that automates the automation.</p>
        </div>

function PluginList({ plugins }) {
  const [states, setStates] = useState({});
  const list = plugins.length ? plugins : [
    { name: "SEO Booster", version: "1.0.0", permissions: ["read_metrics","write_pages"], color: "var(--green)", enabled: true },
    { name: "Lead Tracker", version: "1.0.0", permissions: ["read_metrics"], color: "var(--cyan)", enabled: true },
    { name: "AI Writer", version: "0.9.0", permissions: ["write_pages"], color: "var(--purple)", enabled: false },

  return list.map(p => (

// ─── PAGE: LOGS ───────────────────────────────────────
function LogsPage({ logs, logRef }) {
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const filtered = logs.filter(l => {
    if (filter !== "all" && l.level !== filter) return false;
    if (search && !l.message.toLowerCase().includes(search.toLowerCase()) && !l.source.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  return (
    <div className="panel s12"><div className="panel-head"><span className="panel-title">System Logs</span><span style={{fontSize:10,color:"var(--text-dim)"}}>{filtered.length} / {logs.length}</span></div><div className="panel-body" style={{padding:"8px 14px"}}>
      <div className="filter-bar">
        {["all","info","warn","error"].map(f=><button key={f} className={`filter-btn ${filter===f?"active":""}`} onClick={()=>setFilter(f)}>{f}</button>)}
        <input className="search-input" placeholder="Search logs..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="log-scroll" ref={logRef} style={{maxHeight:"calc(100vh - 220px)"}}>
        {filtered.map(l=>(
          <div className={`log-line ${l.level}`} key={l.id}><span className="log-time">{new Date(l.timestamp).toLocaleTimeString("en-AU",{hour12:false})}</span><span className="log-src">[{l.source}]</span><span className="log-msg">{l.message}</span></div>
        ))}
        {filtered.length===0 && <div style={{color:"var(--text-muted)",padding:20,textAlign:"center"}}>No logs match your filter</div>}
      </div>
    </div></div>
  );
}

          <div className="mem-row"><span className="mem-key">{memResult.key}</span><span className="mem-val">{memResult.value !== null ? JSON.stringify(memResult.value) : <span style={{color:"var(--text-muted)"}}>null</span>}</span></div>

// ─── SHARED: CONTENT STATUS CHIP ─────────────────────
function ContentStatus({ status }) {
  const s = status || "draft";
  return <span className={`c-status ${s}`}><div className="pill-dot"></div>{s.replace("_", " ")}</span>;
}

function ContentToast({ toast, onClose }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onClose, 3500);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  return <div className={`c-toast ${toast.type}`}>{toast.msg}</div>;
}

function useToasts() {
  const [toast, setToast] = useState(null);
  const show = (msg, type = "ok") => setToast({ msg, type, id: Date.now() });
  return { toast, show };
}

// ─── PAGE: BRIEF BUILDER (Content) ────────────────────
function BriefBuilderPage({ onOpenBrief }) {
  const [briefs, setBriefs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("all");
  const [form, setForm] = useState({ topic: "", audience: "", goal: "", tone: "professional", channels: [] });
  const [saving, setSaving] = useState(false);
  const [generatingId, setGeneratingId] = useState(null);
  const [plan, setPlan] = useState(null);
  const { toast, show } = useToasts();

  const CHANNELS = ["Blog", "LinkedIn", "Twitter/X", "Email"];
  const TONES = ["professional", "casual", "bold", "playful", "educational"];

  const load = async () => {
    const [b, p] = await Promise.all([cApi("/briefs"), cApi("/plan")]);
    if (b) setBriefs(b.briefs || []);
    if (p) setPlan(p);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const filtered = briefs.filter(b => filter === "all" || b.status === filter);
  const canGenerate = !plan || plan.allowed === true;

  const create = async () => {
    if (!form.topic.trim()) return show("Topic is required", "err");
    setSaving(true);
    const r = await cPost("/briefs", form);
    if (r.brief) {
      setForm({ topic: "", audience: "", goal: "", tone: "professional", channels: [] });
      show("Brief created");
      load();
    } else show(r.error || "Failed to create brief", "err");
    setSaving(false);
  };

  const generate = async (id) => {
    setGeneratingId(id);
    const r = await cPost(`/briefs/${id}/generate`, { variants: 2 });
    if (r.error) show(r.error, "err");
    else show("Drafts generated");
    setGeneratingId(null);
    load();
  };

  const setChannel = (ch) => {
    const on = form.channels.includes(ch);
    setForm(f => ({ ...f, channels: on ? f.channels.filter(c => c !== ch) : [...f.channels, ch] }));
  };

  return (
    <>
      <div className="panel s12 page-enter"><div className="panel-head"><span className="panel-title">Brief Builder</span>
        <div className="c-btn-row">
          <span className="c-meta" style={{alignSelf:"center"}}>Tenant: <span style={{color:"var(--cyan)"}}>{TENANT}</span></span>
          {plan && <span className={`c-status ${plan.allowed ? "approved" : "error"}`}>{plan.plan.toUpperCase()}{plan.allowed ? "" : " — LIMIT"}</span>}
        </div>
      </div>
      <div className="panel-body" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div className="c-form-col">
          <div>
            <span className="c-label">Topic *</span>
            <input className="c-input" placeholder="e.g. AI content automation" value={form.topic} onChange={e=>setForm(f=>({...f,topic:e.target.value}))}/>
          </div>
          <div className="c-form-row" style={{marginBottom:0}}>
            <div><span className="c-label">Audience</span>
              <input className="c-input" placeholder="Marketing leads" value={form.audience} onChange={e=>setForm(f=>({...f,audience:e.target.value}))}/>
            </div>
            <div><span className="c-label">Goal</span>
              <input className="c-input" placeholder="Drive trial signups" value={form.goal} onChange={e=>setForm(f=>({...f,goal:e.target.value}))}/>
            </div>
          </div>
          <div><span className="c-label">Tone</span>
            <div className="c-pill-toggle">
              {TONES.map(t=> <button key={t} className={form.tone===t?"on":""} onClick={()=>setForm(f=>({...f,tone:t}))}>{t}</button>)}
            </div>
          </div>
          <div><span className="c-label">Target Channels</span>
            <div className="c-pill-toggle">
              {CHANNELS.map(ch=> <button key={ch} className={form.channels.includes(ch)?"on":""} onClick={()=>setChannel(ch)}>{ch}</button>)}
            </div>
          </div>
          <div className="c-btn-row">
            <button className="c-btn primary" onClick={create} disabled={saving}>{saving?"Creating...":"Create Brief"}</button>
          </div>
        </div>
        <div>
          {!canGenerate && plan && (
            <div className="c-card" style={{borderColor:"rgba(255,170,0,0.4)"}}>
              <div style={{color:"var(--amber)",fontSize:12,fontWeight:600,marginBottom:6}}>Free plan generation limit reached</div>
              <div className="c-meta">{plan.used} of {plan.allowance} generations used. Upgrade to Pro for unlimited AI drafts.</div>
            </div>
          )}
          <div className="c-card" style={{borderColor:"rgba(0,234,255,0.25)"}}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--cyan)",marginBottom:6}}>How it works</div>
            <div className="c-meta">1. Write a brief → 2. Generate drafts &amp; variants → 3. Review in Drafts → 4. Approve → 5. Publish &amp; track.</div>
          </div>
        </div>
      </div>
      </div>

      <div className="panel s12"><div className="panel-head"><span className="panel-title">Briefs</span>
        <div className="c-btn-row">
          {["all","draft","generating","draft_ready","approved","published"].map(f=>
            <button key={f} className={`filter-btn ${filter===f?"active":""}`} onClick={()=>setFilter(f)}>{f}</button>)}
        </div>
      </div>
      <div className="panel-body">
        {loading ? <div className="c-empty">Loading briefs…</div> :
         !filtered.length ? (
          <div className="c-empty">
            <div>No briefs yet{filter!=="all"?` in "${filter}"`:""}.</div>
            <div className="c-meta" style={{marginTop:6}}>Create your first brief on the left to start the content pipeline.</div>
          </div>
        ) : filtered.map(b => (
          <div className="c-card" key={b.id}>
            <div className="c-card-head">
              <div>
                <div className="c-card-title">{b.topic || "Untitled brief"}</div>
                <div className="c-card-sub">{b.audience} • {b.goal}</div>
              </div>
              <ContentStatus status={b.status}/>
            </div>
            <div className="c-btn-row" style={{marginBottom:6}}>
              {b.channels.map(ch=> <span key={ch} className="c-chip">{ch}</span>)}
              <span className="c-chip">{b.tone}</span>
            </div>
            {b.status==="generating" && <div className="c-progress"><div style={{width:"60%"}}></div></div>}
            <div className="c-btn-row" style={{marginTop:10}}>
              <button className="c-btn primary" disabled={generatingId===b.id||b.status==="generating"||!canGenerate}
                onClick={()=>generate(b.id)}>{generatingId===b.id?"Generating…":"Generate Drafts"}</button>
              <button className="c-btn" onClick={()=>onOpenBrief(b.id)}>View Drafts</button>
            </div>
          </div>
        ))}
      </div></div>
    </>
  );
}

// ─── PAGE: DRAFT WORKSPACE ────────────────────────────
function DraftWorkspacePage({ focusBriefId }) {
  const [briefs, setBriefs] = useState([]);
  const [briefId, setBriefId] = useState(focusBriefId || null);
  const [assets, setAssets] = useState([]);
  const [brief, setBrief] = useState(null);
  const [selected, setSelected] = useState(null);
  const [versions, setVersions] = useState([]);
  const [editBody, setEditBody] = useState("");
  const [loading, setLoading] = useState(true);
  const { toast, show } = useToasts();

  const loadBriefs = async () => {
    const r = await cApi("/briefs");
    if (r) {
      setBriefs(r.briefs || []);
      if (!briefId && r.briefs?.length) setBriefId(focusBriefId || r.briefs[0].id);
    }
    setLoading(false);
  };

  useEffect(() => { loadBriefs(); }, []);
  useEffect(() => { if (focusBriefId) setBriefId(focusBriefId); }, [focusBriefId]);

  useEffect(() => {
    if (!briefId) return;
    (async () => {
      const [b, a] = await Promise.all([cApi(`/briefs/${briefId}`), cApi(`/briefs/${briefId}/assets`)]);
      if (b?.brief) setBrief(b.brief);
      if (a?.assets) {
        setAssets(a.assets);
        setSelected(a.assets[0] || null);
        setEditBody(a.assets[0]?.body || "");
      }
    })();
  }, [briefId]);

  const pickAsset = async (asset) => {
    setSelected(asset);
    setEditBody(asset.body);
    const v = await cApi(`/assets/${asset.id}/versions`);
    if (v) setVersions(v.versions || []);
  };

  const saveEdit = async () => {
    if (!selected) return;
    const r = await cPost(`/assets/${selected.id}/edit`, { body: editBody, title: selected.title });
    if (r.asset) { show("Draft updated (v" + r.asset.version + ")"); pickAsset(r.asset); }
    else show(r.error || "Save failed", "err");
  };

  const setStatus = async (status) => {
    if (!selected) return;
    const r = await cPost(`/assets/${selected.id}/status`, { status });
    if (r.asset) { show("Status → " + status); pickAsset(r.asset); }
    else show(r.error || "Update failed", "err");
  };

  return (
    <>
      <div className="panel s12 page-enter"><div className="panel-head"><span className="panel-title">Draft Workspace</span>
        <select className="c-select" style={{maxWidth:280}} value={briefId||""} onChange={e=>setBriefId(e.target.value)}>
          <option value="" disabled>Select a brief…</option>
          {briefs.map(b=> <option key={b.id} value={b.id}>{b.topic}</option>)}
        </select>
      </div>
      <div className="panel-body">
        {loading ? <div className="c-empty">Loading…</div> :
         !briefId ? <div className="c-empty">Select a brief to view its drafts.</div> :
         !assets.length ? <div className="c-empty"><div>No drafts for this brief yet.</div><div className="c-meta" style={{marginTop:6}}>Generate drafts from the Brief Builder.</div></div> : (
        <div style={{display:"grid",gridTemplateColumns:"280px 1fr",gap:16}}>
          <div>
            <div className="c-card" style={{padding:10,marginBottom:10}}>
              <div className="c-card-title" style={{fontSize:12}}>{brief?.topic}</div>
              <div className="c-meta" style={{marginTop:4}}>{brief?.audience} • {brief?.goal}</div>
              <div style={{marginTop:8}}><ContentStatus status={brief?.status}/></div>
            </div>
            {assets.map(a=> (
              <div key={a.id} className={`c-version-row ${selected?.id===a.id?"active":""}`} onClick={()=>pickAsset(a)}>
                <div>
                  <div style={{fontWeight:600,color:"var(--text)"}}>{a.title || "Untitled"}</div>
                  <div className="c-meta">{a.type} • v{a.version}</div>
                </div>
                <ContentStatus status={a.status}/>
              </div>
            ))}
          </div>
          {selected && (
            <div>
              <div className="c-card" style={{marginBottom:10}}>
                <div className="c-card-head">
                  <input className="c-input" style={{fontWeight:600,fontSize:13}} value={selected.title}
                    onChange={e=>{setSelected({...selected,title:e.target.value}); setEditBody(editBody);}}/>
                  <div className="c-btn-row">
                    <button className="c-btn ghost" onClick={()=>setStatus("in_review")}>Send to Review</button>
                    <button className="c-btn success" onClick={()=>setStatus("approved")}>Approve</button>
                  </div>
                </div>
                <textarea className="c-textarea" style={{minHeight:320}} value={editBody} onChange={e=>setEditBody(e.target.value)}/>
                <div className="c-btn-row" style={{marginTop:10}}>
                  <button className="c-btn primary" onClick={saveEdit}>Save Version</button>
                  <span className="c-meta" style={{alignSelf:"center"}}>v{selected.version} • {selected.status}</span>
                </div>
              </div>
              <div className="c-card">
                <div className="panel-title" style={{marginBottom:10}}>Version History</div>
                {!versions.length ? <div className="c-meta">No versions yet.</div> :
                 versions.map(v=> (
                  <div className="c-version-row" key={v.version} onClick={()=>setEditBody(v.body)}>
                    <span>v{v.version} <span className="c-meta">— {new Date(v.ts).toLocaleString("en-AU",{hour12:false})} by {v.editor}</span></span>
                    <span style={{color:"var(--cyan)",fontSize:10}}>view</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
      </div></div>
    </>
  );
}

// ─── PAGE: APPROVAL QUEUE ─────────────────────────────
function ApprovalQueuePage() {
  const [assets, setAssets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busyId, setBusyId] = useState(null);
  const { toast, show } = useToasts();

  const load = async () => {
    const r = await cApi("/assets?status=in_review");
    if (r) setAssets(r.assets || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const act = async (id, status, msg) => {
    setBusyId(id);
    const r = await cPost(`/assets/${id}/status`, { status });
    if (r.asset) { show(msg); load(); } else show(r.error || "Action failed", "err");
    setBusyId(null);
  };

  return (
    <div className="panel s12 page-enter"><div className="panel-head"><span className="panel-title">Approval Queue</span>
      <span className="c-meta">{assets.length} awaiting review</span>
    </div>
    <div className="panel-body">
      {loading ? <div className="c-empty">Loading…</div> :
       !assets.length ? (
        <div className="c-empty">
          <div>Queue is clear.</div>
          <div className="c-meta" style={{marginTop:6}}>Drafts appear here once sent to review from the Draft Workspace.</div>
        </div>
      ) : assets.map(a => (
        <div className="c-card" key={a.id}>
          <div className="c-card-head">
            <div>
              <div className="c-card-title">{a.title || "Untitled draft"}</div>
              <div className="c-card-sub">{a.type} • v{a.version} • {new Date(a.updatedAt).toLocaleString("en-AU",{hour12:false})}</div>
            </div>
            <ContentStatus status={a.status}/>
          </div>
          <div className="c-mono" style={{maxHeight:120,overflow:"hidden",marginBottom:10}}>{a.body}</div>
          <div className="c-btn-row">
            <button className="c-btn success" disabled={busyId===a.id} onClick={()=>act(a.id,"approved","Approved")}>✓ Approve</button>
            <button className="c-btn danger" disabled={busyId===a.id} onClick={()=>act(a.id,"draft","Sent back to drafts")}>✗ Reject</button>
            <span className="c-meta" style={{alignSelf:"center"}}>Approved drafts are ready to publish from Calendar.</span>
          </div>
        </div>
      ))}
    </div></div>
  );
}

// ─── PAGE: CALENDAR SCHEDULER ─────────────────────────
function CalendarSchedulerPage() {
  const [channels, setChannels] = useState([]);
  const [assets, setAssets] = useState([]);
  const [form, setForm] = useState({ name: "", format: "blog", schedule: "manual", connector: "webhook" });
  const [publishTarget, setPublishTarget] = useState({ assetId: "", channelId: "" });
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const { toast, show } = useToasts();

  const load = async () => {
    const [c, a] = await Promise.all([cApi("/channels"), cApi("/assets?status=approved")]);
    if (c) setChannels(c.channels || []);
    if (a) setAssets(a.assets || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const addChannel = async () => {
    if (!form.name.trim()) return show("Channel name required", "err");
    const r = await cPost("/channels", form);
    if (r.channel) { show("Channel added"); setForm({ name:"", format:"blog", schedule:"manual", connector:"webhook" }); load(); }
    else show(r.error || "Failed", "err");
  };

  const publish = async () => {
    const { assetId, channelId } = publishTarget;
    if (!assetId || !channelId) return show("Select an asset and a channel", "err");
    setBusy(true);
    const r = await cPost(`/assets/${assetId}/publish`, { channelId });
    if (r.asset) show("Published ✓"); else show(r.error || "Publish failed", "err");
    setBusy(false); load();
  };

  return (
    <>
      <div className="panel s12 page-enter"><div className="panel-head"><span className="panel-title">Calendar Scheduler</span>
        <span className="c-meta">{assets.length} approved draft(s) ready</span>
      </div>
      <div className="panel-body">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div className="c-card">
            <div className="panel-title" style={{marginBottom:12}}>Add Channel</div>
            <div className="c-form-row" style={{marginBottom:8}}>
              <div><span className="c-label">Name</span>
                <input className="c-input" placeholder="LinkedIn Company Page" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
              </div>
              <div><span className="c-label">Format</span>
                <select className="c-select" value={form.format} onChange={e=>setForm(f=>({...f,format:e.target.value}))}>
                  <option value="blog">Blog</option><option value="social">Social</option>
                  <option value="email">Email</option><option value="newsletter">Newsletter</option>
                </select>
              </div>
            </div>
            <div className="c-form-row" style={{marginBottom:8}}>
              <div><span className="c-label">Schedule</span>
                <input className="c-input" placeholder="manual | cron e.g. 0 9 * * 1" value={form.schedule} onChange={e=>setForm(f=>({...f,schedule:e.target.value}))}/>
              </div>
              <div><span className="c-label">Connector</span>
                <select className="c-select" value={form.connector} onChange={e=>setForm(f=>({...f,connector:e.target.value}))}>
                  <option value="webhook">Webhook</option><option value="manual">Manual</option>
                </select>
              </div>
            </div>
            <button className="c-btn primary" onClick={addChannel}>Add Channel</button>
          </div>
          <div className="c-card">
            <div className="panel-title" style={{marginBottom:12}}>Publish Draft</div>
            <div style={{marginBottom:8}}><span className="c-label">Approved Draft</span>
              <select className="c-select" value={publishTarget.assetId} onChange={e=>setPublishTarget(p=>({...p,assetId:e.target.value}))}>
                <option value="">Select draft…</option>
                {assets.map(a=> <option key={a.id} value={a.id}>{a.title || "Untitled"}</option>)}
              </select>
            </div>
            <div style={{marginBottom:12}}><span className="c-label">Channel</span>
              <select className="c-select" value={publishTarget.channelId} onChange={e=>setPublishTarget(p=>({...p,channelId:e.target.value}))}>
                <option value="">Select channel…</option>
                {channels.map(ch=> <option key={ch.id} value={ch.id}>{ch.name} ({ch.format})</option>)}
              </select>
            </div>
            <button className="c-btn success" disabled={busy} onClick={publish}>{busy?"Publishing…":"Publish & Distribute"}</button>
          </div>
        </div>
      </div></div>

      <div className="panel s12"><div className="panel-head"><span className="panel-title">Channels</span></div>
      <div className="panel-body">
        {loading ? <div className="c-empty">Loading…</div> :
         !channels.length ? <div className="c-empty">No channels yet. Add one to start distributing content.</div> :
        <table className="tbl"><thead><tr><th>Channel</th><th>Format</th><th>Schedule</th><th>Connector</th><th>Last Published</th></tr></thead><tbody>
          {channels.map(ch=> (
            <tr key={ch.id}>
              <td style={{fontWeight:600}}>{ch.name}</td>
              <td>{ch.format}</td>
              <td className="c-mono">{ch.schedule}</td>
              <td>{ch.connector || "—"}</td>
              <td>{ch.lastPublishedAt ? new Date(ch.lastPublishedAt).toLocaleString("en-AU",{hour12:false}) : "Never"}</td>
            </tr>
          ))}
        </tbody></table>}
      </div></div>
    </>
  );
}

// ─── PAGE: PERFORMANCE DASHBOARD ──────────────────────
function PerformancePage() {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      const r = await cApi("/analytics");
      if (r) setStats(r);
      setLoading(false);
    })();
  }, []);

  const totals = stats?.totals || { impressions: 0, clicks: 0, conversions: 0 };
  const rates = stats?.rates || { ctr: 0, convRate: 0 };

  return (
    <>
      <div className="panel s12 page-enter"><div className="panel-head"><span className="panel-title">Performance Dashboard</span>
        <span className="c-meta">{stats?.count||0} assets tracked</span>
      </div>
      <div className="panel-body">
        {loading ? <div className="c-empty">Loading…</div> :
         !stats?.count ? (
          <div className="c-empty">
            <div>No performance data yet.</div>
            <div className="c-meta" style={{marginTop:6}}>Publish a draft and analytics will be recorded automatically.</div>
          </div>
        ) : (
        <div className="q-bar-row">
          <div className="q-bar-stat"><div className="c-gauge-num">{totals.impressions.toLocaleString()}</div><div className="q-bar-lbl">Impressions</div></div>
          <div className="q-bar-stat"><div className="q-big" style={{color:"var(--cyan)"}}>{totals.clicks.toLocaleString()}</div><div className="q-bar-lbl">Clicks</div></div>
          <div className="q-bar-stat"><div className="q-big" style={{color:"var(--amber)"}}>{totals.conversions.toLocaleString()}</div><div className="q-bar-lbl">Conversions</div></div>
          <div className="q-bar-stat"><div className="c-rate" style={{color:"var(--green)"}}>{(rates.ctr*100).toFixed(2)}%</div><div className="q-bar-lbl">CTR</div></div>
          <div className="q-bar-stat"><div className="c-rate" style={{color:"var(--purple)"}}>{(rates.convRate*100).toFixed(2)}%</div><div className="q-bar-lbl">Conv. Rate</div></div>
        </div>
        )}
      </div></div>

      <div className="panel s12"><div className="panel-head"><span className="panel-title">Per-Asset Performance</span></div>
      <div className="panel-body">
        {!stats?.count ? null : (
        <table className="tbl"><thead><tr><th>Asset</th><th>Impressions</th><th>Clicks</th><th>Conversions</th><th>CTR</th></tr></thead><tbody>
          {stats.assets.map(a=> (
            <tr key={a.assetId}>
              <td style={{fontWeight:500}}>{a.assetId.slice(0,8)}…</td>
              <td>{a.impressions.toLocaleString()}</td>
              <td>{a.clicks.toLocaleString()}</td>
              <td>{a.conversions.toLocaleString()}</td>
              <td>{a.impressions ? ((a.clicks/a.impressions)*100).toFixed(2)+"%" : "—"}</td>
            </tr>
          ))}
        </tbody></table>)}
      </div></div>
    </>
  );
}

// ─── MAIN APP ─────────────────────────────────────────
function App() {
  const [nav, setNav] = useState("dashboard");
  const [focusBriefId, setFocusBriefId] = useState(null);
  const [system, setSystem] = useState(null);
  const [agents, setAgents] = useState([]);
  const [plugins, setPlugins] = useState([]);
  const [revenue, setRevenue] = useState(null);
  const [queue, setQueue] = useState(null);
  const [logs, setLogs] = useState([]);
  const [wsOk, setWsOk] = useState(false);
  const [time, setTime] = useState("");
  const wsRef = useRef(null);
  const logRef = useRef(null);

  useEffect(()=>{const t=()=>setTime(new Date().toLocaleTimeString("en-AU",{hour12:false}));t();const i=setInterval(t,1000);return()=>clearInterval(i);},[]);

  useEffect(()=>{
    function connect(){const proto=location.protocol==="https:"?"wss:":"ws:";const ws=new WebSocket(`${proto}//${location.host}/ws`);wsRef.current=ws;ws.onopen=()=>setWsOk(true);ws.onclose=()=>{setWsOk(false);setTimeout(connect,3000);};ws.onmessage=(e)=>{const m=JSON.parse(e.data);if(m.type==="history")setLogs(m.data);else if(m.type==="log")setLogs(p=>[...p.slice(-299),m.data]);};}
    connect();return()=>wsRef.current?.close();
  },[]);

  useEffect(()=>{
    async function poll(){const[s,a,p,r,q]=await Promise.all([api("/status"),api("/agents"),api("/plugins"),api("/revenue"),api("/queue")]);if(s)setSystem(s);if(a)setAgents(a.agents||[]);if(p)setPlugins(p.plugins||[]);if(r)setRevenue(r);if(q)setQueue(q);}
    poll();const i=setInterval(poll,3000);return()=>clearInterval(i);
  },[]);

  const onRunAll = useCallback(()=>apiPost("/agents/run",{source:"dashboard"}),[]);

  const [chatOpen, setChatOpen] = useState(false);
  const [chatMsgs, setChatMsgs] = useState([
    {id:1, role:"bot", text:"Hey TDog 🐾 — I'm your ETHINX assistant. Ask me anything about agents, deployments, or the playbook.", ts:"now"}
  ]);
  const [chatDraft, setChatDraft] = useState("");
  const chatEndRef = useRef(null);
  const playbookOpen = nav === "playbook";

  useEffect(()=>{ chatEndRef.current?.scrollIntoView({behavior:"smooth"}); },[chatMsgs]);

  const sendChat = () => {
    const msg = chatDraft.trim();
    if(!msg) return;
    const ts = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    setChatMsgs(p=>[...p, {id:Date.now(), role:"user", text:msg, ts}]);
    setChatDraft("");
    setTimeout(()=>{
      const replies = [
        "On it. Check the Agents page for live status.",
        "That's wired to the orchestrator — run All Agents from the Dashboard.",
        "Playbook Step 3 covers that deployment flow.",
        "Queue is processing. Watch the Logs page for output.",
        "Plugin loaded. Restart the worker to activate it.",
        "Revenue signal confirmed in the Dashboard tile.",
      ];
      const r = replies[Math.floor(Math.random()*replies.length)];
      setChatMsgs(p=>[...p, {id:Date.now()+1, role:"bot", text:r, ts:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}]);
    }, 600);
  };

  const renderPage = () => {
    switch(nav) {
      case "dashboard": return <DashboardPage agents={agents} revenue={revenue} queue={queue} system={system} logs={logs} logRef={logRef} onRunAll={onRunAll}/>;
      case "agents":   return <AgentsPage agents={agents} logs={logs}/>;
      case "queue":    return <QueuePage queue={queue}/>;
      case "plugins":  return <PluginsPage plugins={plugins}/>;
      case "logs":     return <LogsPage logs={logs} logRef={logRef}/>;
      case "settings": return <SettingsPage system={system}/>;
      case "content":  return <BriefBuilderPage onOpenBrief={(id)=>{setFocusBriefId(id); setNav("drafts");}}/>;
      case "drafts":   return <DraftWorkspacePage focusBriefId={focusBriefId}/>;
      case "approvals":return <ApprovalQueuePage/>;
      case "calendar": return <CalendarSchedulerPage/>;
      case "performance": return <PerformancePage/>;
      default: return null;
    }
  };

  return (
    <div className="app">
      {/* TOPBAR */}
      <div className="topbar">
        <div className="topbar-logo">ETHINX</div>
        <div className="topbar-center">
          <div className={`ws-dot ${wsOk?"live":"dead"}`}></div>
          <span className="ws-label">{wsOk?"Connected":"Offline"}</span>
        </div>
        <div className="topbar-right">
          <span className="topbar-time">{time}</span>
          <button className={`chat-toggle ${chatOpen?"active":""}`} onClick={()=>setChatOpen(o=>!o)}>
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
          </button>
          <img src="/assets/3dtdog.gif" className="tdog-topbar-mascot" alt="TDog" onError={(e)=>{e.target.src="/assets/tdog-chibi.png"}}/>
        </div>
      </div>

      {/* SIDEBAR */}
      <div className="sidebar">
        <img src="/assets/tdog-logo.png" className="tdog-sidebar-logo" alt="" onError={(e)=>{e.target.style.display="none"}}/>
        {[
          {id:"dashboard",icon:icons.dashboard,label:"Dashboard"},
          {id:"agents",   icon:icons.agents,   label:"Agents"},
          {id:"queue",    icon:icons.queue,    label:"Queue"},
          {id:"plugins",  icon:icons.plugins,  label:"Plugins"},
          {id:"content",  icon:icons.content,  label:"Content"},
          {id:"drafts",   icon:icons.drafts,   label:"Drafts"},
          {id:"approvals",icon:icons.approvals,label:"Approvals"},
          {id:"calendar", icon:icons.calendar, label:"Calendar"},
          {id:"performance", icon:icons.performance, label:"Performance"},
          {id:"logs",     icon:icons.logs,     label:"Logs"},
          {id:"playbook", icon:icons.playbook, label:"Playbook"},
          {id:"settings", icon:icons.settings, label:"Settings"}
        ].map(n=>(
          <div key={n.id} className={`nav-item ${nav===n.id?"active":""}`} onClick={()=>setNav(n.id)}>
            {n.icon}<span>{n.label}</span>
          </div>
        ))}
      </div>

      {/* MAIN GRID */}
      <div className="main" key={nav}>{renderPage()}</div>

      {/* PLAYBOOK — full-screen slide-over */}
      <div className={`slide-over ${playbookOpen?"open":""}`}>
        <div className="slide-over-head">
          <span className="slide-over-title">
            <img src="/assets/tdog-armor.png" className="tdog-badge" alt="" onError={(e)=>{e.target.style.display="none"}}/>
            Developer Playbook
          </span>
          <div className="slide-over-close" onClick={()=>setNav("dashboard")} title="Close">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
        </div>
        <div className="slide-over-body">
          <PlaybookPage/>
        </div>
      </div>

      {/* CHAT — right-side slide panel */}
      <div className={`chat-panel ${chatOpen?"open":""}`}>
        <div className="chat-panel-head">
          <span className="chat-panel-title">
            <img src="/assets/3dtdog.gif" style={{width:18,height:18,borderRadius:2}} alt=""/>
            TDog Assistant
          </span>
          <span className="chat-panel-close" onClick={()=>setChatOpen(false)}>
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </span>
        </div>
        <div className="chat-msgs">
          {chatMsgs.map(m=>(
            <div key={m.id} className={`chat-msg ${m.role==="user"?"user":"bot"}`}>
              <div className="chat-bubble">{m.text}</div>
              <span className="chat-meta">{m.ts}</span>
            </div>
          ))}
          <div ref={chatEndRef}/>
        </div>
        <div className="chat-input-row">
          <textarea
            className="chat-input"
            placeholder="Ask ETHINX..."
            value={chatDraft}
            onChange={e=>setChatDraft(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}}}
          />
          <div className="chat-send" onClick={sendChat}>
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
        </div>
      </div>

      {/* FLOATING TDOG */}
      <div className="mascot-corner" title="T-Dog is watching...">
        <img src="/assets/3dtdog.gif" alt="TDog" onError={(e)=>{e.target.src="/assets/tdog-dark.png"}}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
